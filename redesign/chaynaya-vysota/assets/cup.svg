<svg xmlns="http://www.w3.org/2000/svg" class="cup-art" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="gaiwan-title">
  <title id="gaiwan-title">Прозрачная гайвань на чайной доске. Солнце частично скрыто горным хребтом.</title>
  <defs>
    <linearGradient id="board" x1="0" x2="1" y2=".3">
      <stop stop-color="#718272"/><stop offset=".59" stop-color="#75826c"/><stop offset="1" stop-color="#9ca48b"/>
    </linearGradient>
    <linearGradient id="glass-wall" x1="0" x2="1">
      <stop stop-color="#f9fff0" stop-opacity=".75"/><stop offset=".11" stop-color="#d7e6d5" stop-opacity=".32"/>
      <stop offset=".28" stop-color="#fffced" stop-opacity=".1"/><stop offset=".64" stop-color="#f6ffed" stop-opacity=".07"/>
      <stop offset=".88" stop-color="#688078" stop-opacity=".27"/><stop offset=".97" stop-color="#fffdec" stop-opacity=".72"/><stop offset="1" stop-color="#798f7d" stop-opacity=".37"/>
    </linearGradient>
    <linearGradient id="tea-body" x1="0" x2=".88" y2=".8">
      <stop stop-color="#f0ba5b" stop-opacity=".72"/><stop offset=".33" stop-color="#cf8437" stop-opacity=".83"/>
      <stop offset=".75" stop-color="#b0672a" stop-opacity=".9"/><stop offset="1" stop-color="#894324" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="tea-top" x2="1" y2=".25">
      <stop stop-color="#f7cf79"/><stop offset=".56" stop-color="#e4a648"/><stop offset="1" stop-color="#ce8b3b"/>
    </linearGradient>
    <linearGradient id="celadon" x1=".2" y1="0" x2=".6" y2="1">
      <stop stop-color="#e2ebd6"/><stop offset=".43" stop-color="#c5d7c2"/><stop offset=".76" stop-color="#9cb5a4"/><stop offset="1" stop-color="#7a998c"/>
    </linearGradient>
    <linearGradient id="clay" x1=".1" y1="0" x2=".8" y2="1">
      <stop stop-color="#c98153"/><stop offset=".45" stop-color="#a75f3d"/><stop offset="1" stop-color="#78422f"/>
    </linearGradient>
    <clipPath id="bowl-inside">
      <path d="M157 248a155 30 0 0 1 310 0q-39 91-121 112-34 12-68 0-82-21-121-112Z"/>
    </clipPath>
    <radialGradient id="cup-shadow">
      <stop stop-color="#284433" stop-opacity=".44"/>
      <stop offset=".56" stop-color="#284433" stop-opacity=".25"/>
      <stop offset="1" stop-color="#284433" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill-edges" x2="1" y2="0">
      <stop stop-color="#fff" stop-opacity="0"/>
      <stop offset=".12" stop-color="#fff" stop-opacity=".36"/>
      <stop offset=".29" stop-color="#fff"/>
      <stop offset=".81" stop-color="#fff"/>
      <stop offset=".90" stop-color="#fff" stop-opacity=".64"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hill-height" x2="0" y2="1">
      <stop stop-color="#fff" stop-opacity="0"/>
      <stop offset=".10" stop-color="#fff"/>
      <stop offset=".37" stop-color="#fff"/>
      <stop offset=".46" stop-color="#fff" stop-opacity=".76"/>
      <stop offset=".61" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="table-edge" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="351" gradientTransform="translate(370 349) scale(1 .406)">
      <stop offset=".24" stop-color="#fff"/>
      <stop offset=".47" stop-color="#fff" stop-opacity=".92"/>
      <stop offset=".63" stop-color="#fff" stop-opacity=".69"/>
      <stop offset=".8" stop-color="#fff" stop-opacity=".36"/>
      <stop offset=".93" stop-color="#fff" stop-opacity=".065"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="hill-passage" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="720" height="500" style="mask-type:alpha">
      <rect width="720" height="500" fill="url(#hill-height)"/>
    </mask>
    <mask id="hill-fade" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="720" height="500" style="mask-type:alpha">
      <rect width="720" height="500" fill="url(#hill-edges)" mask="url(#hill-passage)"/>
    </mask>
    <mask id="table-fade" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="720" height="500" style="mask-type:alpha">
      <rect width="720" height="500" fill="url(#table-edge)"/>
    </mask>
  </defs>

  <!-- The ridges and the sun are opaque, with one shared fade at the outer edges. -->
  <g mask="url(#hill-fade)">
    <circle cx="542" cy="91" r="34" fill="#ce8f70"/>
    <g id="mountains">
      <path fill="#cfd7c5" d="M0 155 23 148 49 149 88 130 125 120 149 93 162 90 174 96 193 77 210 80 228 64 242 68 267 94 292 102 315 127 347 142 385 152 413 167 444 173Q519 208 720 221V314H0Z"/>
      <path fill="#c1cdb9" d="M0 221Q133 215 229 186L281 170 311 154 337 145 356 124 378 117 397 97 420 99 435 85 448 89 468 66 481 64 507 92 521 96 539 115 563 126 580 141 601 144 623 159 654 170 681 189 720 204V314H0Z"/>
      <path fill="#a4b7a7" d="m0 173 29-14 32-26 13 1 25-25 17-5 16-20 11 2 15-17 16 3 14 23 17 12 19 26 29 14 26 21 36 13 23 12 42 10 25 11q97 29 210 42l105 20v36H0Z"/>
      <path fill="#aebfae" d="m720 108-24 9-17 20-25 9-26 27-10 1-16 14-23 7-22 17-27 7-19 13-36 9-39 13q-117 33-234 45L0 311v9h720Z"/>
      <path fill="#8fa595" d="m720 142-28 10-17 18-23 9-22 24-24 9-17 17-27 8-22 15-41 14-24 15-51 14-72 24H720Z"/>
    </g>
  </g>

  <!-- The tea board dissolves into the same paper as the landscape. -->
  <g mask="url(#table-fade)">
    <path d="M0 320 720 258v242H0Z" fill="url(#board)"/>
    <path d="M0 319.5 720 257.5" fill="none" stroke="#e0dcc0" stroke-width="2.3"/>
    <g fill="none" stroke-linecap="round">
      <g stroke="#c7c9a8" opacity=".34">
        <path d="M0 336c104-12 167-12 251-22s147-9 233-19m-318 35c75-7 134-9 229-18m106-21c84-4 165-14 218-15"/>
        <path d="M0 376c81-8 111-9 147-13m351-27c67-7 129-8 222-18M0 439c107-9 168-17 231-18m209-16c89-3 157-13 280-22"/>
        <path d="M42 466c77-2 129-13 209-16m237-23c72-3 150-14 232-17"/>
      </g>
      <g stroke="#334d42" opacity=".53">
        <path d="M0 343c78-10 159-12 224-19m290-24c41-5 97-6 131-10M0 401c56-4 107-11 157-12m370-31 144-13"/>
        <path d="M0 472c65-8 147-17 199-17m230-13c74-9 178-12 291-26M381 480c122-11 241-17 339-31"/>
      </g>
    </g>
  </g>
  <ellipse cx="322" cy="395" rx="184" ry="24" fill="url(#cup-shadow)"/>

  <!-- Celadon saucer and transparent bowl. -->
  <path d="M155 374q8 23 107 31c46 4 106 2 144-5 39-6 62-14 65-26Z" fill="#8ca495" stroke="#536e60" stroke-width="1.6"/>
  <ellipse cx="313" cy="373" rx="158" ry="28" fill="url(#celadon)" stroke="#eef0d8" stroke-width="2.2"/>
  <ellipse cx="313" cy="373" rx="139" ry="20.4" fill="none" stroke="#748f7c" stroke-width="1.3"/>
  <ellipse cx="313" cy="374" rx="94" ry="14" fill="url(#cup-shadow)"/>
  <path d="M260 355q4 12 2 17c2 12 94 15 101 0q-2-7 0-17Z" fill="url(#glass-wall)" stroke="#c4d6bd" stroke-width="2"/>
  <path d="M264 372c11 9 81 11 96 1" fill="none" stroke="#ebedce" stroke-width="2.7"/>
  <path d="M151 247c31 73 69 101 126 117 19 6 49 6 69 0 57-15 98-49 127-117a161 32 0 0 0-322 0Z" fill="url(#glass-wall)"/>
  <path d="M151 247c31 73 69 101 126 117 19 6 49 6 69 0 57-15 98-49 127-117" fill="none" stroke="#6c887a" stroke-width="2.6"/>
  <ellipse cx="312" cy="247" rx="161" ry="32" fill="#edf3df" fill-opacity=".2" stroke="#91a797" stroke-width="1.7"/>
  <g clip-path="url(#bowl-inside)" data-liquid opacity="0">
    <path data-tea-body fill="url(#tea-body)"/>
    <ellipse data-tea-top fill="url(#tea-top)" stroke="#ffe1a1" stroke-width="1.3"/>
  </g>
  <path data-stream fill="none" stroke="#c27a32" stroke-width="4.2" stroke-linecap="round" opacity="0"/>
  <path data-stream-light fill="none" stroke="#ffe5a3" stroke-width="1.35" stroke-linecap="round" opacity="0"/>
  <ellipse data-ripple fill="none" stroke="#fff1ca" stroke-width="1.6" opacity="0"/>
  <g fill="none" stroke-linecap="round">
    <path class="bowl-rim" d="M149 245c0-19 73-35 163-35s163 16 163 35-73 35-163 35-163-16-163-35Z" stroke="#536f63" stroke-width="2.5"/>
    <path d="M151 244c5-18 73-32 160-32 78 0 140 11 156 24" stroke="#fffae4" stroke-width="3.6"/>
    <path d="M154 251c14 17 81 28 159 28 76 0 139-10 155-24" stroke="#f8f8e3" stroke-width="3.8"/>
    <path d="M161 257q38 81 109 100m79 2q64-16 103-78" stroke="#c8d8bf" stroke-width="2.5"/>
    <path d="M172 265q18 42 48 62" stroke="#fffdeb" stroke-width="6" opacity=".71"/>
    <path d="M185 271q11 24 22 33m223-17-14 25" stroke="#f5f8de" stroke-width="2.8" opacity=".8"/>
    <path d="M260 354c21 13 67 16 99 2" stroke="#f3f3da" stroke-width="2" opacity=".78"/>
    <g transform="translate(314 320)" stroke="#fbf5db" stroke-width="1.45" opacity=".72">
      <path d="M0 8c-6-5-7-12 0-20 6 7 6 14 0 20Zm0 0c-9-1-16-6-19-14 8 0 13 3 16 7m3 7c9-1 16-6 19-14-8 0-13 3-16 7"/>
      <path d="M-12 10q12 5 24 0m-16 6h8"/>
    </g>
  </g>
  <!-- The spout ends at the local origin, shared with the animated stream. -->
  <g data-pot visibility="hidden" stroke="#693e2e" stroke-linejoin="round" stroke-linecap="round">
    <path d="M62 15c15-12 30-9 27 5-2 10-11 19-22 17l-2-6c9 3 17-6 18-12 2-7-6-8-17 1Z" fill="url(#clay)" stroke-width="2"/>
    <path d="M31 19C16 19 15 4 4 0L0 1c5 5 6 20 15 26 5 4 10 6 17 7Z" fill="url(#clay)" stroke-width="1.8"/>
    <path d="M23 27c1-9 8-15 20-17l17 1c12 4 19 11 17 22-2 12-16 19-31 18-17-1-26-10-23-24Z" fill="url(#clay)" stroke-width="2"/>
    <path d="M35 14q16-11 31 2c-8 5-23 5-32 0Z" fill="#b56f48" stroke-width="1.7"/>
    <ellipse cx="50" cy="9" rx="4.5" ry="3.8" fill="#a76040" stroke-width="1.4"/>
    <path d="M38 47q11 5 23 1m-29-23q3-4 7-5m5-6q7-2 11 0" fill="none" stroke="#e4a373" stroke-width="1.5"/>
    <path d="M1 1 5 1.3" fill="none" stroke="#553527" stroke-width="1.9"/>
  </g>
</svg>
